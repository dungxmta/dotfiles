# Settings: only what differs from lazygit's defaults (see docs/Config.md); keybindings below are fully pinned.
gui:
  nerdFontsVersion: "3"
  timeFormat: 02 Jan 06 15:04 MST
git:
  # Inline diff with syntax highlighting; "|" cycles renderers
  diffRenderers:
    - command: delta --dark --paging=never
    # difftastic:
    # - type: extDiff
    #   command: difft --color=always --display=inline --syntax-highlight=on --tab-width=2
# Keybindings: full v0.66.2 defaults pinned so lazygit upgrades don't change them
# (https://github.com/jesseduffield/lazygit/blob/v0.66.2/docs/Config.md); "override:" marks my changes.
# After upgrading, diff against the new Config.md block and add new actions here.
keybinding:
  universal:
    quit: [q, <ctrl+c>]
    suspendApp: <ctrl+z>
    return: <esc>
    quitWithoutChangingDirectory: Q
    togglePanel: <tab>
    prevItem: [<up>, k]
    nextItem: [<down>, j]
    prevPage: ','
    nextPage: .
    scrollLeft: H
    scrollRight: L
    gotoTop: [<, <home>]
    gotoBottom: ['>', <end>]
    toggleRangeSelect: v
    rangeSelectDown: <shift+down>
    rangeSelectUp: <shift+up>
    prevBlock: [<left>, h, <backtab>]
    nextBlock: [<right>, l, <tab>]
    jumpToBlock:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
    focusMainView: "0"
    jumpToFile: <ctrl+g>
    # moveWordLeft/Right, backspaceWord, forwardDeleteWord, confirmInEditor: not pinned,
    # their defaults differ per OS (alt on macOS, ctrl elsewhere)
    nextMatch: "n"
    prevMatch: "N"
    startSearch: /
    optionMenu: [x, '?'] # override: default '?'
    select: <space>
    goInto: <enter>
    confirm: <enter>
    confirmMenu: <enter>
    confirmSuggestion: <enter>
    remove: d
    new: "n"
    newWorktree: w
    edit: e
    openFile: o
    scrollUpMain: [<pgup>, K, <ctrl+u>]
    scrollDownMain: [<pgdown>, J, <ctrl+d>]
    executeShellCommand: ':'
    createRebaseOptionsMenu: m

    # 'Files' appended for legacy reasons
    pushFiles: P

    # 'Files' appended for legacy reasons
    pullFiles: p
    refresh: R
    createPatchOptionsMenu: <ctrl+p>
    nextTab: ']'
    prevTab: '['
    nextScreenMode: +
    prevScreenMode: _
    cycleDiffRenderers: '|'
    cycleDiffRenderersReverse: \
    undo: z
    redo: Z
    filteringMenu: <ctrl+s>
    diffingMenu: [W, <ctrl+e>]
    copyToClipboard: <ctrl+o>
    openRecentRepos: <ctrl+r>
    submitEditorText: <enter>
    extrasMenu: '@'
    toggleWhitespaceInDiffView: <ctrl+w>
    increaseContextInDiffView: '}'
    decreaseContextInDiffView: '{'
    increaseRenameSimilarityThreshold: )
    decreaseRenameSimilarityThreshold: (
    openDiffTool: <ctrl+t>
    editConfig: <alt+shift+c>
  status:
    checkForUpdate: u
    recentRepos: <enter>
    allBranchesLogGraph: a
    allBranchesLogGraphReverse: A
  files:
    commitChanges: c
    commitChangesWithoutHook: w
    amendLastCommit: A
    commitChangesWithEditor: C
    findBaseCommitForFixup: <ctrl+f>
    confirmDiscard: x
    ignoreFile: i
    refreshFiles: r
    stashAllChanges: s
    viewStashOptions: S
    toggleStagedAll: <disabled> # override: default a; stage file by file with <space>
    viewResetOptions: D
    fetch: f
    toggleTreeView: '`'
    openMergeOptions: M
    openStatusFilter: <ctrl+b>
    copyFileInfoToClipboard: "y"
    collapseAll: '-'
    expandAll: =
  branches:
    createPullRequest: o
    viewPullRequestOptions: O
    openPullRequestInBrowser: G
    copyPullRequestURL: <ctrl+y>
    checkoutBranchByName: c
    forceCheckoutBranch: F
    checkoutPreviousBranch: '-'
    rebaseBranch: r
    renameBranch: R
    mergeIntoCurrentBranch: M
    moveCommitsToNewBranch: "N"
    viewGitFlowOptions: i
    fastForward: f
    createTag: T
    pushTag: P
    setUpstream: u
    fetchRemote: f
    addForkRemote: F
    sortOrder: s
  commits:
    squashDown: s
    renameCommit: r
    renameCommitWithEditor: R
    viewResetOptions: g
    markCommitAsFixup: f
    setFixupMessage: c
    createFixupCommit: F
    squashAboveCommits: S
    moveDownCommit: [<ctrl+j>, <alt-down>]
    moveUpCommit: [<ctrl+k>, <alt-up>]
    amendToCommit: A
    resetCommitAuthor: a
    pickCommit: p
    revertCommit: t
    cherryPickCopy: C
    pasteCommits: V
    markCommitAsBaseForRebase: B
    tagCommit: T
    checkoutCommit: <space>
    resetCherryPick: <ctrl+r>
    copyCommitAttributeToClipboard: "y"
    openLogMenu: <ctrl+l>
    openInBrowser: o
    openPullRequestInBrowser: G
    viewBisectOptions: b
    startInteractiveRebase: i
    selectCommitsOfCurrentBranch: '*'
  amendAttribute:
    resetAuthor: a
    setAuthor: A
    addCoAuthor: c
  stash:
    popStash: g
    renameStash: r
  commitFiles:
    checkoutCommitFile: c
  main:
    prevHunk: [<left>, h]
    nextHunk: [<right>, l]
    prevFile: "N"
    nextFile: "n"
    toggleSelectHunk: a
    pickBothHunks: b
    editSelectHunk: E
  submodules:
    init: i
    update: u
    bulkMenu: b
  commitMessage:
    commitMenu: <ctrl+o>
os:
  editPreset: "nvim-remote"
customCommands:
  - key: "b"
    command: "gh browse"
    context: "files"
notARepository: skip
