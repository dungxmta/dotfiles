#use zsh as default
set-option -g default-shell /bin/zsh
#set colors: 
#this was added of an error I cant remeber
# set -g default-terminal "rxvt-unicode-256color"
# neovim says: $TERM should be "screen-256color" or "tmux-256color": but kitty is setting it to :xterm-kitty
# set-option -g default-terminal "screen-256color"
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# when closing a session, go to the next one
set-option -g detach-on-destroy off
# and close current session (above will automatically switch to next session)
bind q kill-session
#bind T display-popup -E "tt"

set -g base-index 1              # start indexing windows, panes at 1 instead of 0
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on       # renumber all windows when any window is closed
set -g history-limit 1000000     # increase history size (from 2,000)
set -g set-clipboard on          # use system clipboard
set -g status-position bottom    # top, bottom

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
{{- if eq .chezmoi.os "darwin" }}
set -g @plugin 'tmux-plugins/tmux-yank'
{{- end }}
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
# set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'alexwforsythe/tmux-which-key'
# persist tmux sessions after computer restart
#  prefix + Ctrl-s - save
#  prefix + Ctrl-r - restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
# automatically saves sessions for you every 15 minutes.
# knwon issue:
#  In order to be executed periodically, the plugin updates the status-right tmux variable.
#  In case some plugin (usually themes) overwrites the status-right variable, the autosave feature stops working.
#  To fix this issue, place the plugin last in the TPM plugins list.
set -g @plugin 'tmux-plugins/tmux-continuum'

# Preserves what was readable in each pane.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# ## config plugin floax
# set -g @floax-width '80%'
# set -g @floax-height '80%'
# set -g @floax-border-color 'magenta'
# set -g @floax-text-color 'blue'
# set -g @floax-bind 'p'
# set -g @floax-change-path 'true'
# set -g @floax-session-name 'popup'

## config fzf-url
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# set tmux theme -> set in kitty instead
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark' # or 'light'

# Undercurl - for tmux
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# temp fix bug tmux-sensible when upgrade tmux 3.5 to 3.5a
# https://github.com/tmux/tmux/issues/4162#issue-2567682883
set -gu default-command
set -g default-shell "$SHELL"

# Change default prefix key (chosen in ./install.sh; C-b nests inside a C-a host tmux)
{{- if ne .tmuxPrefix "C-b" }}
unbind C-b
{{- end }}
set-option -g prefix {{ .tmuxPrefix }}
# allow multiple commands to be entered without pressing the prefix-key again (miniseconds)
set-option -g repeat-time 0


set-window-option -g mode-keys vi
# entering vim mode to copy or scroll up with vim motions
bind 'v' copy-mode

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
# don't exit copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode-vi DoubleClick1Pane
# bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection
{{- if eq .chezmoi.os "darwin" }}

set -g @yank_action 'copy-pipe' # for tmux-yank; default option 'copy-pipe-and-cancel'
{{- else }}
# no tmux-yank here: set-clipboard on copies to the Mac clipboard over SSH (OSC 52)
{{- end }}
#map another shortcut to clear window as c-l is now taken for navigation: now `ctrl+t and b`
bind b send-keys 'C-l' # ~ clear command
bind B clear-history \; display-message "Pane history clear" # clear pane history (buffer)

# set switching between last active tabs forth and back
# bind-key k select-window -l
# unbind '"'

# vim-like pane switching -> use christoomey/vim-tmux-navigator
# bind -r k select-pane -U
# bind -r j select-pane -D
# bind -r h select-pane -L
# bind -r l select-pane -R

# Switching tmux zoom between panes without zooming out
bind -r u select-pane -t .+1 \;  resize-pane -Z

# set prefix + ctrl + z (not prefix + z) to zoom to avoid accidental suspend my tmux session
#  what prefix + ctrl + z does by default.
bind C-z resize-pane -Z

# double keymaps as in vim are not possible -> sticking with <c-hjkl> thenjkl> thenjkl> then
unbind s
unbind C-w
# select session in zoom (fullscreen)
bind C-w choose-session -Z 
# unbind due to conflict with changing sessions
unbind C-s
# easily switch session with ctrl+s
#bind -n C-s run-shell -b "~/.tmux/tmux-switch-session.sh"

## sesh
#bind-key "S" display-popup -E -w 40% "sesh connect \"$(
#  sesh list -i | gum filter --limit 1 --placeholder 'Pick a sesh' --prompt='⚡'
#)\""

bind-key "S" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key "W" run-shell "sesh window \"$(sesh window | fzf-tmux -p 60%,50% --prompt '🪟  ')\""


# Split windows
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# unbind -T prefix C-l
# unbind -T root C-l

# switch/jump between two recent sessions
bind-key ";" switch-client -l
bind -T prefix l last-window

# bind-key -n ss select-pane -R
# bind sl select-pane -R
# bind-key sh select-pane -L

# Resizing pane -> doesn't work well with navigating up and down. Using arrow keys instead
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5
# bind -T prefix C-l resize-pane -R 5

# Enable mouse mode (tmux 2.1 and above) such as select window
set -g mouse on

# shift + control switch windows
#bind-key -n C-S-Left swap-window -t -1
#bind-key -n C-S-Right swap-window -t +1


#try to use same keybinidng for vim and tmux:
#is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
#    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
#
#bind-key -n sh  if-shell  "$is_vim"  "send-keys sh"  "select-pane -L"   

#source status line theme for tmux:
#source-file ~/.tmux/themes/tmux-kanagawa-dark.conf
source-file ~/.config/tmux/themes/tmux-kanagawa-dark-v2.conf

# able to refresh tmux config with "Ctrl-t" and then "R":
#unbind r
bind R source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
bind r command-prompt "rename-window %%"
unbind c
bind-key c command-prompt -p "New window: " "new-window -n '%%'"
bind-key C command-prompt -p "New session: " "new-session -s '%%'"
# When attach session with "some-path", open new windows in this session use "some-path", even new session still the same.
#  to set default directory for new windows in this session to current directory
#  use "attach-session -c" from command prompt or in a binding
bind {{ .tmuxPrefix }} attach-session -c "#{pane_current_path}" \; display-message "Tmux set default dir for new windows to #{pane_current_path}"

# tpm defaults to ~/.config/tmux/plugins when this file lives there; keep it where scripts/setup-tmux.sh clones tpm
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# keep it at bottom to ignore overwrite by plugin
# prefix + l to switching last-window
# prefix + Ctrl-hjkl to resize-pane
bind-key -T prefix C-l resize-pane -R 5
bind-key -T prefix l last-window
