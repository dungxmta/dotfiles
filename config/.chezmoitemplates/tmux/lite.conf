# tmux lite: plugin-free, server-oriented config

## Shell & terminal
set -gu default-command
set -g default-shell "$SHELL"
# fallback: use "screen-256color" if this server lacks tmux-256color terminfo
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

## Sensible defaults (replaces tmux-sensible)
set -s escape-time 0
set -g display-time 4000
set -g status-interval 5
set -g status-keys emacs
set -g focus-events on
setw -g aggressive-resize on
bind C-p previous-window
bind C-n next-window

## General options
# when closing a session, go to the next one
set-option -g detach-on-destroy off
bind q kill-session

set -g base-index 1              # start indexing windows, panes at 1 instead of 0
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on       # renumber all windows when any window is closed
set -g history-limit 5000
set -g set-clipboard on          # use system clipboard
set -g status-position bottom    # top, bottom
set -g mouse on

## Prefix (chosen in ./install.sh; C-b avoids clashing with desktop C-a when nesting)
{{- if ne .tmuxPrefix "C-b" }}
unbind C-b
{{- end }}
set -g prefix {{ .tmuxPrefix }}
bind {{ .tmuxPrefix }} send-prefix
set -g repeat-time 0

## Pane navigation shared with vim (replaces vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

## Copy mode
set-window-option -g mode-keys vi
bind 'v' copy-mode
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
# don't exit copy mode after dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode-vi DoubleClick1Pane
# Teleport web/xterm.js ignores OSC 52: toggle mouse off to use browser selection + Cmd/Ctrl+C
bind m set -g mouse \; display-message "mouse #{?mouse,on,off}"
# C-l is taken by navigation: prefix + b clears the screen
bind b send-keys 'C-l' # ~ clear command
bind B clear-history \; display-message "Pane history clear" # clear pane history (buffer)

## Panes, windows, sessions
# Switching tmux zoom between panes without zooming out
bind -r u select-pane -t .+1 \;  resize-pane -Z
# prefix + C-z zooms (avoids accidental suspend)
bind C-z resize-pane -Z
unbind s
unbind C-w
# select session in zoom (fullscreen)
bind C-w choose-session -Z 
unbind C-s

# Split windows
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# switch/jump between two recent sessions / windows
bind-key ";" switch-client -l
bind -T prefix l last-window

# Resizing panes
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

## Reload & prompts
bind R source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"
bind r command-prompt "rename-window %%"
unbind c
bind-key c command-prompt -p "New window: " "new-window -n '%%'"
bind-key C command-prompt -p "New session: " "new-session -s '%%'"

## THEME: kanagawa dark
set-option -g status "on"
set-option -g status-style bg=#16161d,fg=colour223 # bg=bg1, fg=fg1
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3
set-window-option -g window-status-current-style bg=red,fg=colour237 # fg=bg1
set-option -g pane-active-border-style fg=colour250 #fg2
set-option -g pane-border-style fg=colour237 #bg1
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1
set-option -g display-panes-active-colour colour250 #fg2
set-option -g display-panes-colour colour237 #bg1
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""
# host IP: `hostname -I` on Linux, `ipconfig getifaddr en0` fallback
# (shell group uses { } because a plain ")" would terminate tmux's #( ... ))
set-option -g status-left "#[bg=colour241,fg=#c8c093] #S@#h #({ hostname -I 2>/dev/null || ipconfig getifaddr en0 2>/dev/null; } | awk '{print $1}') "
set-option -g status-right "#[bg=#2a2a37,fg=colour239 nobold, nounderscore, noitalics]|#[bg=colour239,fg=#c8c093] %Y-%m-%d | %H:%M "
set-window-option -g window-status-current-format "#[bg=#2a2a37,fg=#c8c093,nobold,noitalics,nounderscore]|#[bg=#2a2a37,fg=#c8c093] #I-#W#{?window_zoomed_flag,*Z,} #[bg=#2a2a37,fg=#c8c093,nobold,noitalics,nounderscore]|"
set-window-option -g window-status-format "#[bg=#2a2a37,fg=colour248] #I-#[bg=#2a2a37,fg=colour248]#W "
